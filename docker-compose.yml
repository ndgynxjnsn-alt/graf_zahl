# Grafana observability showcase: logs + metrics + traces + profiles.
#
#   app (Spring Boot)  --OTLP-->  Alloy  -->  Loki  (logs)
#                                          -->  Tempo (traces)
#                                          -->  Mimir (metrics + exemplars)
#   app (Pyroscope agent) --------------->  Pyroscope (profiles)
#   Grafana reads all four. k6 generates load.
#
# The Spring Boot app runs twice, in the "production" and "test" environments.
#
# Runs both with Compose (`docker compose up -d --build`) and as a Swarm stack
# (`docker compose build` then `docker stack deploy -c docker-compose.yml graf-zahl`).
# All config files are shipped as top-level `configs:` (not bind mounts) so the
# stack is portable across Swarm nodes. Swarm ignores build/container_name/
# depends_on/restart with warnings — that's expected.
# (No top-level `name:` — `docker stack deploy` rejects it; the stack name is
# the CLI arg, and Compose falls back to the directory name.)

# Shared config for the two app instances. Only ENVIRONMENT-derived values differ.
x-app-common: &app-common
  build: ./app
  # Explicit image so Swarm (which doesn't build) can schedule the locally built
  # image. Build once with `docker compose build`.
  image: graf-zahl-app:local
  restart: unless-stopped
  depends_on:
    - alloy
    - pyroscope
  environment: &app-common-env
    # OTLP to Alloy. exporter=otlp, protocol=http/protobuf, trace-based
    # exemplars and cumulative bucketed histograms are all OTel agent defaults,
    # so the endpoint is the only thing to set (http/protobuf uses :4318).
    # Export interval is shortened from the 60s default so the demo moves quickly.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    # The Pyroscope agent runs the profiler; the otel-profiling extension only
    # bridges to it and tags profiles with the active span. Profiles ship to
    # Alloy, which relays to Pyroscope.
    OTEL_PYROSCOPE_START_PROFILING: "false"
    OTEL_PYROSCOPE_ADD_SPAN_NAME: "true"
    PYROSCOPE_APPLICATION_NAME: graf-zahl-demo
    PYROSCOPE_SERVER_ADDRESS: http://alloy:9999

services:
  # ----------------------------------------------------------------------
  # Application, one container per environment
  # ----------------------------------------------------------------------
  app-production:
    <<: *app-common
    container_name: app-production
    environment:
      <<: *app-common-env
      ENVIRONMENT: production
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production"
      PYROSCOPE_LABELS: "environment=production"
    ports:
      - { target: 8080, published: 8081, mode: host }

  app-test:
    <<: *app-common
    container_name: app-test
    environment:
      <<: *app-common-env
      ENVIRONMENT: test
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=test"
      PYROSCOPE_LABELS: "environment=test"
    ports:
      - { target: 8080, published: 8082, mode: host }

  # ----------------------------------------------------------------------
  # Grafana Alloy: single OTLP collector, fans out to the backends
  # ----------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    ports:
      - { target: 12345, published: 12345, mode: host } # Alloy UI
      - { target: 9999, published: 9999, mode: host }   # Pyroscope profile ingest
    depends_on:
      - loki
      - tempo
      - mimir

  # ----------------------------------------------------------------------
  # Backends (all single-tenant)
  # ----------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.3
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    configs:
      - source: loki_config
        target: /etc/loki/loki-config.yml
    volumes:
      - loki-data:/loki
    ports:
      - { target: 3100, published: 3100, mode: host }

  tempo:
    image: grafana/tempo:3.0.2
    container_name: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    configs:
      - source: tempo_config
        target: /etc/tempo/tempo-config.yml
    volumes:
      - tempo-data:/var/tempo
    ports:
      - { target: 3200, published: 3200, mode: host }

  mimir:
    image: grafana/mimir:3.1.3
    container_name: mimir
    restart: unless-stopped
    # Pin every dskit ring to loopback. This is a single-replica monolith, so
    # all components live in one container and only ever talk to themselves.
    # Without this, Swarm's overlay/VIP networking makes a component's own
    # advertised IP unreachable and gRPC ring dials time out.
    command:
      - -config.file=/etc/mimir/mimir-config.yml
      - -ingester.ring.instance-addr=127.0.0.1
      - -distributor.ring.instance-addr=127.0.0.1
      - -querier.ring.instance-addr=127.0.0.1
      - -store-gateway.sharding-ring.instance-addr=127.0.0.1
      - -compactor.ring.instance-addr=127.0.0.1
      - -ruler.ring.instance-addr=127.0.0.1
      - -query-scheduler.ring.instance-addr=127.0.0.1
      - -query-frontend.instance-addr=127.0.0.1
      - -overrides-exporter.ring.instance-addr=127.0.0.1
    configs:
      - source: mimir_config
        target: /etc/mimir/mimir-config.yml
    volumes:
      - mimir-data:/data
    ports:
      - { target: 9009, published: 9009, mode: host }

  pyroscope:
    image: grafana/pyroscope:2.1.1
    container_name: pyroscope
    restart: unless-stopped
    # Same loopback pinning as Mimir (single-replica monolith) so ring gRPC
    # dials (segment-writer, scheduler, frontend) work under Swarm networking.
    # Keep the image's default -config.file and just append the ring flags.
    command:
      - -config.file=/etc/pyroscope/config.yaml
      - -segment-writer.lifecycler.addr=127.0.0.1
      - -distributor.ring.instance-addr=127.0.0.1
      - -compactor.ring.instance-addr=127.0.0.1
      - -store-gateway.sharding-ring.instance-addr=127.0.0.1
      - -query-scheduler.ring.instance-addr=127.0.0.1
      - -query-frontend.instance-addr=127.0.0.1
      - -overrides-exporter.ring.instance-addr=127.0.0.1
    volumes:
      - pyroscope-data:/data
    ports:
      - { target: 4040, published: 4040, mode: host }

  # ----------------------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_showcase
        target: /etc/dashboards/showcase.json
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - { target: 3000, published: 3000, mode: host }
    depends_on:
      - loki
      - tempo
      - mimir
      - pyroscope

  # ----------------------------------------------------------------------
  # Load generator
  # ----------------------------------------------------------------------
  k6:
    image: grafana/k6:2.1.0
    container_name: k6
    restart: unless-stopped
    command: run /scripts/script.js
    configs:
      - source: k6_script
        target: /scripts/script.js
    depends_on:
      - app-production
      - app-test

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  pyroscope-data:
  grafana-data:

# Config files shipped to the cluster (Swarm-native; Compose mounts them too).
configs:
  alloy_config:
    file: ./alloy/config.alloy
  loki_config:
    file: ./loki/loki-config.yml
  tempo_config:
    file: ./tempo/tempo-config.yml
  mimir_config:
    file: ./mimir/mimir-config.yml
  grafana_datasources:
    file: ./grafana/provisioning/datasources/datasources.yml
  grafana_dashboard_provider:
    file: ./grafana/provisioning/dashboards/dashboards.yml
  grafana_dashboard_showcase:
    file: ./grafana/dashboards/showcase.json
  k6_script:
    file: ./k6/script.js
