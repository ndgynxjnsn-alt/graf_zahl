---
- name: Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ stack_dir }}/traefik"
    - "{{ stack_dir }}/traefik/dynamic"

- name: Render Traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ stack_dir }}/traefik/traefik.yml"
    mode: "0644"
  notify: Restart traefik

- name: Render Traefik dynamic config
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ stack_dir }}/traefik/dynamic/dynamic.yml"
    mode: "0644"

- name: Render Traefik compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ stack_dir }}/traefik/compose.yml"
    mode: "0644"

- name: Start Traefik
  ansible.builtin.command:
    cmd: docker compose -f {{ stack_dir }}/traefik/compose.yml up -d
  register: traefik_up
  changed_when: "'Started' in traefik_up.stderr or 'Created' in traefik_up.stderr or 'Recreated' in traefik_up.stderr"
