# Static inventory for the 3-node cluster. IPs match the Vagrantfile private
# network. The dev VMs share Vagrant's insecure key (config.ssh.insert_key =
# false); on real hardware, replace ansible_user/ansible_ssh_private_key_file
# with your own SSH credentials and keep everything else identical.
[cluster]
node1 ansible_host=192.168.56.11
node2 ansible_host=192.168.56.12
node3 ansible_host=192.168.56.13

[cluster:vars]
ansible_user=vagrant
ansible_ssh_private_key_file={{ lookup('env', 'HOME') }}/.vagrant.d/insecure_private_keys/vagrant.key.ed25519
ansible_python_interpreter=/usr/bin/python3
